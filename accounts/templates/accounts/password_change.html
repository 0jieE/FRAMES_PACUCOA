{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block heading %}Change password{% endblock %}
{% block content %}
<div class="card" style="max-width:640px">
  <div class="card-body">
    <form method="post">{% csrf_token %}
      {% include "partials/_form_fields.html" with col="col-12" %}
      <div class="mt-4 d-flex gap-2">
        <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Change password</button>
        <a class="btn btn-outline-secondary" href="{% url 'accounts:home' %}">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
