{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block heading %}Reset password — {{ target.username }}{% endblock %}
{% block content %}
<div class="card" style="max-width:640px"><div class="card-body">
  <form method="post" data-confirm="Reset the password of {{ target.username }}?">{% csrf_token %}
    {% include "partials/_form_fields.html" with col="col-12" %}
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary" type="submit"><i class="bi bi-key"></i> Reset password</button>
      <a class="btn btn-outline-secondary" href="{% url 'accounts:user_list' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
