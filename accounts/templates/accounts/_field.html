{% if field %}
  {% if field.widget_type == "checkbox" %}
    <div class="col-md-4"><div class="form-check mt-md-4">
      {{ field }} <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div></div>
  {% else %}
    <div class="col-md-6 col-xl-4">
      <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
      <div class="{% if field.errors %}is-invalid-wrap{% endif %}">{{ field }}</div>
      {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
  {% endif %}
{% endif %}
