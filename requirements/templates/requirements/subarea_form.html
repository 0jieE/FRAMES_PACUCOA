{% extends "base.html" %}
{% block title %}Sub-area{% endblock %}
{% block heading %}{% if object %}Edit sub-area {{ object.code }}{% else %}New sub-area{% endif %}{% endblock %}
{% block content %}
<div class="card" style="max-width:820px"><div class="card-body">
  <form method="post" novalidate>{% csrf_token %}
    {% include "partials/_form_fields.html" %}
    <div class="mt-4 d-flex gap-2">
      <button class="btn btn-primary" type="submit"><i class="bi bi-check2"></i> Save</button>
      <a class="btn btn-outline-secondary" href="{% url 'requirements:list' %}">Cancel</a>
    </div>
  </form>
</div></div>
{% endblock %}
